<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Cidade Viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1c2b27; --muted:#5a6a64; --panel:#ffffff; --panel2:#edf5e8; --line:#cfdcc8;
  --gold:#ffc43d; --goldD:#c98f00; --leaf:#2f8f57; --leafD:#1d6a3e; --sky:#2b6cb0; --skyD:#1d4f86;
  --danger:#d64545; --dangerD:#a12f2f; --scene:#5b8a4a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eaf2ec; --muted:#a2b4ac; --panel:#1f2a26; --panel2:#283731; --line:#0f1714;
    --scene:#3f6334;
  }
}
:root[data-theme="dark"]{
  --ink:#eaf2ec; --muted:#a2b4ac; --panel:#1f2a26; --panel2:#283731; --line:#0f1714; --scene:#3f6334;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--scene);color:var(--ink);
  font-family:'Baloo 2',ui-rounded,'Segoe UI Rounded','Segoe UI',system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.placing{cursor:crosshair}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* HUD */
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;z-index:5;pointer-events:none}
.chip{display:flex;align-items:center;gap:4px;min-height:38px;background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;
  box-shadow:0 3px 0 var(--line),0 6px 14px rgba(0,0,0,.14);font-weight:700;font-size:15px;line-height:1.1;min-width:0;flex:1 1 0;
  white-space:nowrap;overflow:hidden}
.chip svg{width:26px;height:26px;flex:none}
.chip .v{overflow:hidden;text-overflow:ellipsis;display:flex;flex-direction:column;min-width:0}
.chip .v b{font-weight:700}
.chip .v small{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:-1px}
.chip.full .v b,.chip.full .v small{color:var(--danger)}
.chip.lvl{flex:0 0 auto;padding-right:8px;gap:6px;pointer-events:auto;cursor:pointer;border:0}
.star{position:relative;width:30px;height:30px;flex:none}
.star svg{width:30px;height:30px}
.star b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800;color:#3b2a00;padding-top:2px}
.xpbar{width:44px;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--sky);border-radius:4px;transition:width .3s}

.peek{position:absolute;top:52px;left:8px;z-index:5;max-width:230px;background:var(--panel);border:0;border-radius:12px;
  padding:6px 10px 7px;text-align:left;box-shadow:0 3px 0 var(--line),0 6px 14px rgba(0,0,0,.14);cursor:pointer;font-size:13px;line-height:1.25}
.peek strong{display:block;font-size:14px}
.peek .pb{height:6px;background:var(--panel2);border-radius:3px;margin-top:4px;overflow:hidden}
.peek .pb i{display:block;height:100%;background:var(--leaf)}
.peek.ready{background:var(--gold);color:#3b2a00;box-shadow:0 3px 0 var(--goldD),0 6px 14px rgba(0,0,0,.14)}
.peek.ready .pb{display:none}

/* Dock */
.dock{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:7px;padding:0 8px;z-index:5}
.btn{border:0;border-radius:14px;padding:7px 9px 5px;background:var(--panel);
  box-shadow:0 4px 0 var(--line),0 8px 16px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:13px;font-weight:700;min-width:60px;cursor:pointer;position:relative;line-height:1.1}
.btn svg{width:26px;height:26px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),0 3px 8px rgba(0,0,0,.18)}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 4px 0 var(--goldD),0 8px 16px rgba(0,0,0,.18)}
.btn.gold:active{box-shadow:0 1px 0 var(--goldD)}
.btn.on{background:var(--sky);color:#fff;box-shadow:0 4px 0 var(--skyD),0 8px 16px rgba(0,0,0,.18)}
.badge{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;border-radius:999px;font-size:12px;
  min-width:21px;height:21px;padding:0 5px;display:grid;place-items:center;font-weight:800}
.badge[hidden]{display:none}

/* Place bar */
.placebar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;background:var(--panel);
  border-radius:16px;padding:9px 10px 10px 14px;display:flex;align-items:center;gap:10px;width:min(560px,calc(100% - 16px));
  box-shadow:0 4px 0 var(--line),0 10px 24px rgba(0,0,0,.25)}
.placebar[hidden]{display:none}
.placebar .txt{flex:1;min-width:0;font-size:14px;line-height:1.2}
.placebar .txt b{display:block;font-size:16px}
.placebar .txt span{color:var(--muted)}
.placebar .txt span.bad{color:var(--danger)}
.pill{border:0;border-radius:12px;padding:9px 14px 7px;font-weight:800;font-size:15px;cursor:pointer;background:var(--panel2);
  box-shadow:0 3px 0 var(--line)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pill.go{background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leafD)}
.pill.go:disabled{opacity:.45}
.pill.warn{background:var(--danger);color:#fff;box-shadow:0 3px 0 var(--dangerD)}
.pill.gold{background:var(--gold);color:#3b2a00;box-shadow:0 3px 0 var(--goldD)}
.pill:disabled{cursor:default}

/* Sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;max-height:74%;background:var(--panel);
  border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.28);transform:translateY(110%);transition:transform .22s ease;
  z-index:10;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 18px}
.sheet h2{margin:0;font-size:22px;font-weight:800;flex:1;line-height:1.1}
.x{border:0;background:var(--panel2);width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:800;cursor:pointer;line-height:1}
.sbody{overflow:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:999px;padding:6px 13px 4px;background:var(--panel2);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--panel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:0;background:var(--panel2);border-radius:16px;padding:8px 8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;
  box-shadow:0 3px 0 var(--line)}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.card img{width:100%;aspect-ratio:150/120;object-fit:contain;display:block}
.card b{font-size:16px;line-height:1.1}
.card .price{display:flex;align-items:center;gap:3px;font-weight:800;font-size:15px}
.card .price svg{width:18px;height:18px}
.card small{color:var(--muted);font-size:12.5px;line-height:1.25}
.card.locked{cursor:not-allowed}
.card.locked img{filter:grayscale(1);opacity:.45}
.card .lock{font-size:13px;font-weight:800;color:var(--sky)}
.card.poor .price{color:var(--danger)}
.status{margin:2px 0 12px;font-size:16px;line-height:1.4}
.status small{color:var(--muted);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.rows{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:14px;padding:8px 10px}
.row .dot{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.row .info{flex:1;min-width:0;line-height:1.2}
.row .info b{display:block;font-size:16px}
.row .info small{color:var(--muted);font-size:13px}
.row.locked{opacity:.55}
.row .pill{padding:7px 11px 5px;font-size:14px}
.q{background:var(--panel2);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.q .info{flex:1;line-height:1.25}
.q .info b{font-size:16px;display:block}
.q .info small{color:var(--muted)}
.q .pb{height:8px;background:var(--panel);border-radius:4px;margin-top:5px;overflow:hidden}
.q .pb i{display:block;height:100%;background:var(--leaf)}
.help p{margin:0 0 10px;line-height:1.45;font-size:15px}
.help b{font-weight:800}
.muted{color:var(--muted)}

/* Toast & modal */
.toasts{position:absolute;bottom:96px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:20;pointer-events:none}
.toast{background:var(--ink);color:var(--panel);padding:7px 14px 5px;border-radius:12px;font-weight:700;font-size:14px;max-width:88%;text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin .2s ease}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
.modal{position:absolute;inset:0;background:rgba(10,20,15,.45);display:grid;place-items:center;z-index:30;padding:20px}
.modal[hidden]{display:none}
.mcard{background:var(--panel);border-radius:22px;padding:20px 20px 18px;width:min(380px,100%);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mcard h3{margin:0 0 4px;font-size:26px;font-weight:800;line-height:1.1}
.mcard p{margin:6px 0 14px;font-size:16px;line-height:1.4}
.mcard .acts{justify-content:center}
.bigstar{width:76px;height:76px;margin:-52px auto 4px;position:relative}
.bigstar svg{width:76px;height:76px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.bigstar b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;color:#3b2a00;padding-top:4px}
.unl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 14px}
.unl span{background:var(--panel2);border-radius:999px;padding:3px 10px 1px;font-weight:700;font-size:14px}
@media (max-width:420px){
  .hud{gap:5px}
  .chip{font-size:14px;padding-right:6px;gap:3px}
  .chip svg{width:22px;height:22px}
  .xpbar{width:30px}
  .btn{min-width:0;flex:1 1 0;font-size:12px;padding:6px 4px 4px}
}
@media (prefers-reduced-motion: reduce){
  .sheet{transition:none}.toast{animation:none}.xpbar i{transition:none}
}

.chip .ico{width:28px;height:28px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.chip.mat{flex:0 0 auto;padding:3px 10px 3px 6px;cursor:pointer;border:0;pointer-events:auto}
.chip.mat .v{font-size:13px;line-height:1.05}
.chip.mat .v span{display:flex;align-items:center;gap:3px}
.icow{position:relative;display:flex;flex:none}.happy{position:absolute;right:-2px;top:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--panel);background:#f2c230}
.card canvas{width:100%;aspect-ratio:150/120;display:block}
.card .cls{align-self:flex-start;color:#fff;border-radius:999px;padding:1px 8px 0;font-size:11.5px;font-weight:700}
.card .mat{font-weight:700;font-size:13px}
.needs{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 5px}
.need{border-radius:999px;padding:2px 9px 0;font-size:13px;font-weight:700;background:var(--panel2);color:var(--muted)}
.need.on{background:var(--c);color:#fff}
h4.sub{margin:6px 0 6px;font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px;margin-bottom:8px}
.fld select{font:inherit;font-size:15px;padding:7px 8px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--ink)}
#artPrev{width:100%;max-width:420px;border-radius:14px;display:block;margin:0 auto}
.pill.up{display:inline-flex;align-items:center}
.sl{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:4px 0}
.sl input{width:100%}
.sl em{font-style:normal;color:var(--muted);text-align:right}
code{font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:6px}
#pbRot[hidden],#pbLine[hidden]{display:none}
#pbLine.on{background:var(--sky);color:#fff;box-shadow:0 3px 0 var(--skyD)}
.wx{position:absolute;top:52px;right:8px;z-index:5;border:0;background:var(--panel);border-radius:999px;padding:4px 10px 2px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--line),0 6px 14px rgba(0,0,0,.14);cursor:pointer}
canvas.chart{width:100%;height:auto;display:block;margin-top:4px;touch-action:pan-y}
.pill:disabled{opacity:.5}
@media (max-width:420px){.hud{gap:4px;left:6px;right:6px}.chip{font-size:13px;gap:2px;padding:3px 6px 3px 3px}.chip .v small{font-size:10.5px}.chip.mat{padding:3px 6px 3px 4px}.chip.mat .v{font-size:11.5px}.chip .ico{width:21px;height:21px}.chip.lvl{padding-right:5px;gap:3px}.xpbar{width:22px}.star,.star svg{width:26px;height:26px}.peek{max-width:200px;font-size:12px}.peek strong{font-size:13px}}

/* trilho lateral, barra de pincéis, visão, evento */
.rail{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}
.rb[data-g="enfeite"]{letter-spacing:-.4px}
.rb{border:0;width:58px;border-radius:16px;padding:6px 2px 4px;background:var(--panel);box-shadow:0 4px 0 var(--line),0 8px 16px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:0;font-weight:700;font-size:11.5px;cursor:pointer;line-height:1.1}
.rb svg{width:28px;height:28px}.rb:active{transform:translateY(3px)}.rb.on{background:var(--sky);color:#fff}
.toolbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:6;background:var(--panel);border-radius:18px;padding:8px 8px 9px;width:min(720px,calc(100% - 12px));box-shadow:0 4px 0 var(--line),0 10px 24px rgba(0,0,0,.25)}
.toolbar[hidden]{display:none}
.tb-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}.tb-row::-webkit-scrollbar{display:none}.tb-row[hidden]{display:none}
.tchip{border:0;flex:none;background:var(--panel2);border-radius:12px;padding:3px 6px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-weight:700;font-size:12.5px;line-height:1.1;box-shadow:0 2px 0 var(--line);position:relative}
.tchip canvas{width:58px;height:36px}.tchip.on{background:var(--sky);color:#fff;box-shadow:0 2px 0 var(--skyD)}.tchip.locked{opacity:.5}.tchip em{font-style:normal;font-size:10.5px}
.ochip{border:0;flex:none;background:var(--panel2);border-radius:999px;padding:4px 10px 3px 5px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:13px;line-height:1.05;text-align:left}
.ochip i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.15)}.ochip canvas{width:36px;height:23px}
.ochip small{display:block;font-size:11px;font-weight:600;color:var(--muted)}.ochip.on{background:var(--ink);color:var(--panel)}.ochip.on small{color:var(--line)}.ochip.locked{opacity:.5}
.tb-foot{display:flex;align-items:center;gap:8px}.tb-foot .txt{flex:1;min-width:0;font-size:13.5px;line-height:1.2}.tb-foot .txt span{display:block;color:var(--muted);font-size:12.5px}
.viewbar{position:absolute;left:8px;right:74px;top:54px;z-index:6;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px}.viewbar[hidden]{display:none}.viewbar .tab{box-shadow:0 2px 6px rgba(0,0,0,.2)}.viewbar .x{flex:none;width:30px;height:30px;font-size:17px}
.evban{position:absolute;left:50%;transform:translateX(-50%);top:54px;z-index:4;background:#a64fd6;color:#fff;border-radius:999px;padding:3px 12px 1px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.2);max-width:calc(100% - 260px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.evban[hidden]{display:none}
.row .dot.emo{display:grid;place-items:center;background:var(--panel);font-size:18px;box-shadow:none}
.row canvas.bsw{width:70px;height:44px;flex:none}
.title-card{background:linear-gradient(135deg,#ffe58a,#ffc43d);color:#3b2a00;border-radius:16px;padding:10px 14px;margin-bottom:10px}.title-card b{display:block;font-size:24px;line-height:1.1}.title-card small{font-size:13px;font-weight:600}
.title-card .pb{height:8px;background:rgba(255,255,255,.6);border-radius:4px;margin:6px 0 3px;overflow:hidden}.title-card .pb i{display:block;height:100%;background:#2f8f57}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.stats div{background:var(--panel2);border-radius:12px;padding:6px 4px;text-align:center;line-height:1.1}.stats b{display:block;font-size:18px}.stats small{font-size:11.5px;color:var(--muted)}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.inv div{background:var(--panel2);border-radius:14px;padding:8px 4px;text-align:center;line-height:1.1}.inv span{font-size:24px;display:block}.inv b{display:block;font-size:18px}.inv small{color:var(--muted);font-size:12px}
.q .info b .ok{color:var(--leaf)}.q .info b .no{color:var(--danger)}.q .pill{padding:7px 10px 5px;font-size:14px}
.col{background:var(--panel2);border-radius:14px;padding:9px 11px;margin-bottom:8px}.colh b{display:block;font-size:16px}.colh small{color:var(--muted);font-size:12.5px}
.colit{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.colit span{border-radius:999px;padding:2px 9px 0;font-size:12.5px;font-weight:700;background:var(--panel);color:var(--muted);border:1px dashed var(--line)}.colit span.got{background:#ffe58a;color:#3b2a00;border-style:solid;border-color:#e0a400}
#app.tb .toasts{bottom:200px}
small.setl{display:block;color:#b5523b;font-weight:700}
@media (max-width:420px){.rail{right:5px;gap:6px}.rb{width:50px;font-size:10.5px}.rb[data-g="enfeite"]{font-size:9.4px;letter-spacing:-.3px}.rb svg{width:24px;height:24px}.stats b{font-size:15px}.evban{top:auto;bottom:84px;max-width:calc(100% - 20px)}.viewbar{right:60px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud">

function peakZone(x,y){return serraZone(x,y)||inLote(ARCO,x,y)||inLote(PORTAL_LOTE,x,y)||(inMap(x,y)&&DECOR_MASK[y*N+x]===1);}

function massif(x,y){return (x<=41&&y<=21)||(x<=13&&y<=40)||(x>=14&&x<=19&&y>=25&&y<=41)||(x<=4&&y<=50);}

function coastX(y){y=y<=41?y:y<54?41:y-12; return 89.2+1.8*Math.sin(y*.21+.7)+1.2*Math.sin(y*.071+2.1)+.8*Math.sin(y*.53);}

function cornerZ(x,y){const i=y*N+x, z=cornerL(G.ht[i],G.rp[i]); z[0]*=HZ; z[1]*=HZ; z[2]*=HZ; z[3]*=HZ; return z;}
// altura (em px) de um ponto qualquer do mapa
function hAt(fx,fy){const x=Math.floor(fx),y=Math.floor(fy); if(!inMap(x,y))return 0; const i=y*N+x; const r=G.rp[i]; if(!r)return G.ht[i]*HZ;
  const z=cornerZ(x,y), u=fx-x, v=fy-y;
  if(r<5)return z[0]+(z[1]-z[0])*u+(z[3]-z[0])*v;
  const k=(r-5)%4;
  if(k===0||k===2){if(u+v<=1)return z[0]+(z[1]-z[0])*u+(z[3]-z[0])*v; return z[2]+(z[3]-z[2])*(1-u)+(z[1]-z[2])*(1-v);}
  if(u>=v)return z[0]+(z[1]-z[0])*u+(z[2]-z[1])*v; return z[0]+(z[3]-z[0])*v+(z[2]-z[3])*u;}
// altura (em níveis) da borda de um quadrado na direção d (null = borda inclinada)
const EDGE_C=[[1,2],[2,3],[0,3],[0,1]];
function edgeZ(x,y,d){const i=y*N+x; if(!G.rp[i])return G.ht[i]; const z=cornerZ(x,y), a=z[EDGE_C[d][0]], b=z[EDGE_C[d][1]]; return a===b?a/HZ:null;}
function linked(x,y,d,grid){const X=x+DIRS4[d][0],Y=y+DIRS4[d][1]; if(!inMap(X,Y))return false; const a=edgeZ(x,y,d),b=edgeZ(X,Y,(d+2)%4); return a!=null&&a===b;}

    if(t.pop)pop+=t.pop; const done=now>=b.d; if(done&&t.cap)popCap+=t.cap; if(done&&t.store)gCap+=t.store; if(done&&t.hydro)d.hydro++; if(done&&t.clean)d.clean++;});

const popc=m=>{let c=0;while(m){c+=m&1;m>>=1;}return c;};
function dist(a,b){const aw=fw(a),ah=fh(a),bw=fw(b),bh=fh(b);

function stationLinked(b){const w=fw(b),h=fh(b); for(let i=-1;i<=w;i++)for(let j=-1;j<=h;j++){if(i>=0&&i<w&&j>=0&&j<h)continue; const X=b.x+i,Y=b.y+j; if(inMap(X,Y)&&D.rail[Y*N+X])return [X,Y];} return null;}
function freeTile(x,y,ignore,water){if(!isUl(x,y)||peakZone(x,y))return false; const i=y*N+x; if(!water&&(G.tr[i]===1||G.tr[i]===2))return false; if(G.rd[i]||G.rl[i]||G.ob[i]||qHas(x,y))return false;
  const o=D.occ[i]; return o===-1||o===ignore;}
function canPlace(k,x,y,f,ignore){const t=T[k],w=f?t.h:t.w,h=f?t.w:t.h; let L=null, wat=0, land=0; if(placeRule(t,x,y,w,h))return false;

    if(t.port){const u=f?dy:dx; if(u>=2){if(!isW||G.rd[i]||!isUl(X,Y)||D.occ[i]!==-1&&D.occ[i]!==ignore)return false; continue;} }
    if(t.hydro&&isW){if(G.tr[i]!==1||G.rd[i]||!isUl(X,Y)||(D.occ[i]!==-1&&D.occ[i]!==ignore))return false; wat++; continue;}
    if(!freeTile(X,Y,ignore))return false; if(G.rp[i])return false; if(L==null)L=G.ht[i]; else if(G.ht[i]!==L)return false; land++;}

function whyNot(k,x,y,f){const t=T[k],w=f?t.h:t.w,h=f?t.w:t.h; let lv=null; const pr=placeRule(t,x,y,w,h); if(pr)return pr;

  for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){const X=x+dx,Y=y+dy; if(!isUl(X,Y))return 'Área não comprada'; const i=Y*N+X;
    if(G.ob[i])return 'Limpe os obstáculos'; if(G.rp[i])return 'Não dá pra construir em rampa'; if(lv==null)lv=G.ht[i]; else if(lv!==G.ht[i]&&!(G.tr[i]===1))return 'O chão precisa estar nivelado';}

function decoBonus(b){const t=T[b.k]; if(t.cat!=='res'&&t.cat!=='biz')return 0; const now=Date.now(); let bo=0;
  for(const d of S.b){const dt=T[d.k]; if(!dt.bonus||now<d.d)continue; if(dist(b,d)<=2)bo+=dt.bonus;}
  // calçadas e cercas por perto também enfeitam
  const w=fw(b),h=fh(b); let q=0; for(let y=Math.max(0,(b.y-1)*2);y<Math.min(Q2,(b.y+h+1)*2);y++)for(let x=Math.max(0,(b.x-1)*2);x<Math.min(Q2,(b.x+w+1)*2);x++)if(G.pv[y*Q2+x]||G.fc[y*Q2+x])q++;
  bo+=Math.min(10,Math.floor(q/3));

    for(let i=0;i<w&&!road;i++)if(isCarRd(b.x+i,b.y-1)||isCarRd(b.x+i,b.y+h))road=true;
    for(let j=0;j<h&&!road;j++)if(isCarRd(b.x-1,b.y+j)||isCarRd(b.x+w,b.y+j))road=true;

const EV_SLOT=90*60000, EV_LEN=30*60000;
function curEvent(now){now=now||Date.now(); const slot=Math.floor(now/EV_SLOT); if(now-slot*EV_SLOT>EV_LEN)return null; const e=EVENTS[hsh(slot,7,3)%EVENTS.length]; return Object.assign({end:slot*EV_SLOT+EV_LEN},e);}
function nextEvent(now){now=now||Date.now(); const slot=Math.floor(now/EV_SLOT)+1; return Object.assign({start:slot*EV_SLOT},EVENTS[hsh(slot,7,3)%EVENTS.length]);}
function evMul(k){const e=curEvent(); return e&&e[k]?e[k]:1;}

  if(t.item)S.inv[t.item]-=t.sup; else S.goods-=t.sup; b.s=1; b.a=Date.now()+t.bt*1000; S.st.supply++;
  if(!silent)floatAt(b,'-'+t.sup+' '+(t.item?ITEMS[t.item].ico:'merc.'),'#ffb35c'); return true;}
function harvest(b,silent){const now=Date.now(); if(!b.s||now<b.a)return 0; const c=C[b.s];
  const space=D.gCap-S.goods; if(space<=0){if(!silent)toast('Depósito cheio. Construa um Galpão ou gaste mercadorias.');return -1;}
  const g=Math.round(c.g*evMul('harvest')*(hasTech('agro')?1.25:1)*(1+farmBuff(b,'yield')/100)); const got=Math.min(space,g); S.goods+=got; S.st.harvest++; b.s=''; b.a=0;
  if(!silent){floatAt(b,'+'+got+' merc.','#ffb35c'); if(got<g)toast('Depósito cheio: '+(g-got)+' mercadorias ficaram para trás.');}
  gainXp(c.xp); return got;}
function plant(b,ck){const c=C[ck]; if(S.lv<c.lv){toast('Libera no nível '+c.lv);return false;}
  if(S.coins<c.cost){toast('Faltam '+fmtN(c.cost-S.coins)+' moedas');return false;} if(b.s||Date.now()<b.d)return false;
  S.coins-=c.cost; b.s=ck; b.a=Date.now()+c.t*1000*(1-farmBuff(b,'speed')/100); S.st.plant++; return true;}
function farmBuff(b,k){let v=0; for(const o of S.b){const fb=T[o.k].farmBuff; if(fb&&Date.now()>=o.d&&dist(b,o)<=fb.r)v=Math.max(v,fb[k]||0);} return v;}

/* ---- Indústria ---- */
function prodMul(){let m=D.hydro?.75:1; m*=1-Math.min(.25,.05*(D.clean||0)); if(S.b.some(o=>T[o.k].indBuff&&Date.now()>=o.d))m*=.9; if(law('filtros'))m*=1.1; return m;}
const prodTime=(t,r)=>Math.round((r||t.rec).t*prodMul());
const recOf=b=>b.r===2&&T[b.k].rec2?T[b.k].rec2:T[b.k].rec;
function canStart(b){const t=T[b.k]; return !lacksMat(t.rec.in,t.rec.c).length||(t.rec2&&!lacksMat(t.rec2.in,t.rec2.c).length);}
function startProd(b,silent){const t=T[b.k],now=Date.now(); if(now<b.d||b.s)return false;
  let r=t.rec, ri=1; if(t.rec2&&!lacksMat(t.rec2.in,t.rec2.c).length){r=t.rec2; ri=2;}
  const l=lacksMat(r.in,r.c); if(l.length){if(!silent)toast('Faltam '+l.join(', '));return false;}
  S.coins-=r.c; payMat(r.in); b.s='run'; b.r=ri; b.a=now+prodTime(t,r)*1000; if(!silent)floatAt(b,'-'+r.c,'#ffd43b'); return true;}
function collectProd(b,silent){const t=T[b.k],now=Date.now(); if(b.s!=='run'||now<b.a)return 0;
  const rc=recOf(b); const parts=[]; for(const k in rc.out){const q=Math.round(rc.out[k]*evMul('prod')); S.inv[k]+=q; parts.push('+'+q+' '+ITEMS[k].ico);}
  b.s=''; b.a=0; b.r=0; S.st.prod++; gainXp(Math.max(2,Math.round((rc.t)/15))); drop('engren',.05,b); if(rc.out.stone||rc.out.ore||rc.out.lime)drop('minerais',.05,b);
  if(!silent)floatAt(b,parts.join(' '),'#ffe6a8'); return 1;}

/* ---- Trem, porto e exportação ---- */
const EXP_Q={goods:100,wood:20,stone:20,steel:10,rubber:10,tools:6,tires:6,cars:2};
function expPay(item,port){return Math.round(ITEMS[item].val*EXP_Q[item]*(port?1.7:1.3));}
function trainArrive(b,silent){const now=Date.now(); if(!b.s||now<b.a)return 0;
  if(b.s==='exp'){const tr=b.trip||{pay:0}; S.coins+=tr.pay; S.st.export++; b.s=''; b.a=0; b.trip=null; if(!silent)floatAt(b,'+'+fmtN(tr.pay),'#ffd43b'); gainXp(Math.round(tr.pay/40));
    if(T[b.k].port){drop('conchas',1,b);} else drop('conchas',.15,b); return tr.pay;}
  const tr=TR[b.s]; const space=D.gCap-S.goods; if(space<=0){if(!silent)toast('Depósito cheio. Abra espaço antes de descarregar.');return -1;}
  const got=Math.min(space,tr.g); S.goods+=got; b.s=''; b.a=0; if(!silent){floatAt(b,'+'+got+' merc.','#ffb35c');}
  gainXp(Math.max(1,Math.round(tr.g/20))); return got;}
function sendTrain(b,id){const tr=TR[id]; if(!D.linked.has(b.i)){toast('Ligue a estação ao túnel com trilhos primeiro');return;}
  if(S.lv<tr.lv){toast('Libera no nível '+tr.lv);return;} if(S.coins<tr.cost){toast('Faltam '+fmtN(tr.cost-S.coins)+' moedas');return;}
  S.coins-=tr.cost; b.s=id; b.t0=Date.now(); b.a=Date.now()+tr.t*1000; S.st.train++; floatAt(b,'-'+fmtN(tr.cost),'#ffd43b'); after(); closeSheet();}
const AIR_ITEMS=['goods','tools','tires'];
function sendExport(b,item){const air=!!T[b.k].air, port=!air&&!!T[b.k].port; if(!port&&!air&&!D.linked.has(b.i)){toast('Ligue a estação ao túnel com trilhos primeiro');return;}
  if(air&&!AIR_ITEMS.includes(item)){toast('O avião só leva carga leve');return;}
  const q=EXP_Q[item], have=item==='goods'?S.goods:S.inv[item]; if(have<q){toast('Precisa de '+q+' '+ITEMS[item].name.toLowerCase());return;}
  if(item==='goods')S.goods-=q; else S.inv[item]-=q; b.s='exp'; b.t0=Date.now(); b.trip={item,qty:q,pay:Math.round(expPay(item,port)*(air?1.25:1))}; b.a=Date.now()+(air?240:port?900:300)*1000;
  toast((air?'Avião':port?'Navio':'Trem')+' saiu com '+q+' '+ITEMS[item].name.toLowerCase()); after(); closeSheet();}

function collectAll(){const now=Date.now(); let coins=0,goods=0,n=0,full=false,prod=0;
  for(const b of S.b){const t=T[b.k]; if(now<b.d)continue;
    if(t.cat==='res'||t.cat==='biz'||isGen(t)){const c=collect(b,true); if(c){coins+=c;n++;}}
    else if(b.k==='plot'){const g=harvest(b,true); if(g>0){goods+=g;n++;} else if(g<0)full=true;}
    else if(b.k==='estacao'||b.k==='porto'||b.k==='aeroporto'){const g=trainArrive(b,true); if(g>0){n++; if(b.trip===null)coins+=0;} else if(g<0)full=true;}
    else if(t.rec){if(collectProd(b,true)){prod++;n++;} if(!b.s&&startProd(b,true))n++;}}
  let sup=0; for(const b of S.b){if(T[b.k].cat==='biz'&&b.s===0&&now>=b.d){if(supply(b,true))sup++;}}
  const tax=taxAmt(); if(tax>=10){collectTax(true); coins+=tax; n++;}
  if(!n&&!sup){toast(full?'Depósito cheio. Construa um Galpão.':'Nada pronto agora');return;}
  const parts=[]; if(coins)parts.push('+'+fmtN(coins)+' moedas'); if(goods)parts.push('+'+fmtN(goods)+' mercadorias'); if(prod)parts.push(prod+' produção'+(prod>1?'ões':''));
  if(sup)parts.push(sup+' comércio'+(sup>1?'s':'')+' abastecido'+(sup>1?'s':''));
  toast((parts.join(' · ')||'Tudo coletado')+(full?' · depósito cheio':'')); after();}
function readyCount(){const now=Date.now(); let n=0;
  for(const b of S.b){const t=T[b.k]; if(now<b.d)continue;
    if(t.cat==='res'&&now>=b.a)n++; else if(t.cat==='biz'&&((b.s===1&&now>=b.a)||(b.s===0&&supHave(t)>=t.sup)))n++;
    else if((b.k==='plot'||b.k==='estacao'||b.k==='porto'||b.k==='aeroporto')&&b.s&&now>=b.a)n++;
    else if(t.rec&&((b.s==='run'&&now>=b.a)||(!b.s&&canStart(b))))n++; else if(isGen(t)&&now>=b.a)n++;}
  if(taxAmt()>=10)n++; return n;}
function sellB(b){const t=T[b.k]; const ref=Math.floor(t.cost/2); S.coins+=ref; S.b=S.b.filter(x=>x!==b); if(selId===b.i)selId=null; after(); toast(t.name+' vendido(a) por '+fmtN(ref)+' moedas');}

/* ---- Turismo: taxa recolhida na Prefeitura ---- */
function taxRate(){return D.tourists*.6;} // moedas por minuto
function taxAmt(){if(!S||!D.tourists)return 0; const min=Math.min(360,(Date.now()-S.taxT)/60000); return Math.floor(min*taxRate());}
function collectTax(silent){const a=taxAmt(); if(a<1)return 0; S.coins+=a; S.taxT=Date.now(); const h=S.b.find(b=>b.k==='hall'); if(!silent&&h)floatAt(h,'+'+fmtN(a),'#ffd43b'); gainXp(Math.max(1,Math.round(a/30))); return a;}

/* ---- Obstáculos ---- */
function clearOb(x,y,silent){const i=y*N+x, o=OB[G.ob[i]]; if(!o)return false;
  if(!isUl(x,y)){if(!silent)toast('Compre esta área primeiro (Expandir)');return false;}
  if(S.coins<o.cost){toast('Faltam '+fmtN(o.cost-S.coins)+' moedas para limpar');return false;}
  const m=evMul('clear'); S.coins-=o.cost; G.ob[i]=0; S.st.clear++; S.inv.wood+=o.wood*m; S.inv.stone+=o.stone*m; if(o.coins)S.coins+=o.coins*m;
  const parts=[]; if(o.wood)parts.push('+'+o.wood*m+' 🪵'); if(o.stone)parts.push('+'+o.stone*m+' 🪨'); if(o.coins)parts.push('+'+o.coins*m);
  floatXY(x+.5,y+.5,30+hAt(x+.5,y+.5),parts.join(' ')||('+'+o.xp+' XP'),o.stone?'#d9dde3':o.wood?'#e7b77a':'#ffd43b');
  if(o.stone)drop('minerais',G.ht[i]?.08:.04); puff(x+.5,y+.5); gainXp(o.xp); after(); return true;}

/* ---- Pincéis ---- */
const tileBusy=(x,y)=>D.occ[y*N+x]!==-1;
function toolCost(tool,opt){if(tool==='ponte'){const m=BRIDGES[opt||0]; return {c:m.c,mat:m.mat};} return {c:TOOLS[tool].cost,mat:null};}
function toolCheck(tool,x,y,opt){const tl=TOOLS[tool];
  if(tl.q){const qx=x,qy=y; if(qx<0||qy<0||qx>=Q2||qy>=Q2)return 'fora'; x=qx>>1; y=qy>>1;
    if(!isUl(x,y))return 'Área não comprada'; if(peakZone(x,y))return 'A serra é só paisagem'; const i=y*N+x, qi=qy*Q2+qx;
    if(tool==='apagar')return (G.pv[qi]||G.fc[qi])?'':'já';
    if(G.tr[i]===1||G.tr[i]===2)return 'Não dá na água'; if(tileBusy(x,y))return 'Ocupado'; if(G.rd[i]||G.rl[i])return 'Tem rua ou trilho aqui'; if(G.ob[i])return 'Limpe o obstáculo primeiro'; if(G.rp[i])return 'Não dá em rampa';
    if(tool==='piso'&&G.pv[qi]===(opt||0)+1)return 'já'; if(tool==='muro'&&G.fc[qi]===(opt||0)+1)return 'já'; return '';}
  if(!inMap(x,y))return 'fora'; if(!isUl(x,y))return 'Área não comprada'; if(peakZone(x,y))return 'A serra é só paisagem';
  const i=y*N+x, tr=G.tr[i], rd=G.rd[i], busy=tileBusy(x,y), wat=tr===1||tr===2;
  switch(tool){
    case 'rua': if(wat)return 'Na água use a Ponte'; if(busy)return 'Ocupado'; if(G.ob[i])return 'Limpe o obstáculo primeiro'; if(rd===1)return 'já'; return '';
    case 'ponte': if(tr!==1)return tr===2?'Ponte só em rio ou lago':'Ponte só sobre rio ou lago'; if(G.rl[i])return 'Tem trilho aqui'; if(rd===2&&G.bm[i]===(opt||0))return 'já'; if(S.lv<BRIDGES[opt||0].lv)return 'Esse modelo libera no nível '+BRIDGES[opt||0].lv; return '';
    case 'trilho': if(tr===2)return 'Trilho não vai no mar'; if(busy)return 'Ocupado'; if(G.ob[i])return 'Limpe o obstáculo primeiro'; if(G.rp[i])return 'Trem não sobe rampa'; if(rd===2)return 'Tem ponte de carro aqui'; if(G.rl[i])return 'já'; return '';
    case 'remover': if(x===TUN.x&&y===TUN.y)return 'O túnel fica'; if(rd||G.ob[i]||G.rl[i])return ''; return 'já';
    case 'elevar': case 'rebaixar': case 'nivelar':{if(wat)return 'Não dá na água'; if(busy)return 'Tem construção aqui'; if(rd||G.rl[i])return 'Tire a rua ou o trilho antes';
      const L=G.ht[i]; if(tool==='elevar'&&L>=4)return 'Altura máxima'; if(tool==='rebaixar'&&L<=0&&!G.rp[i])return 'já';
      if(tool==='nivelar'&&L===(opt||0)&&!G.rp[i])return 'já'; return '';}
    case 'rampa':{if(wat)return 'Não dá na água'; if(busy)return 'Tem construção aqui'; if(G.rl[i])return 'Trem não sobe rampa'; if(G.rp[i])return 'já';
      const L=G.ht[i]; for(let d=0;d<4;d++){const X=x+DIRS4[d][0],Y=y+DIRS4[d][1]; if(inMap(X,Y)&&edgeZ(X,Y,(d+2)%4)===L+1)return '';} return 'A rampa precisa de um vizinho um nível acima';}
    case 'cavar': if(wat)return 'já'; if(busy||rd||G.rl[i])return 'Ocupado'; if(G.ob[i])return 'Limpe o obstáculo primeiro'; if(G.ht[i]||G.rp[i])return 'Só dá pra cavar no nível do chão'; return '';
    case 'aterrar': if(tr!==1)return 'já'; if(rd||G.rl[i])return 'Tire a ponte ou o trilho antes'; return '';
    case 'pintar': if(wat)return 'Não dá na água'; if(tr===SOILS[opt||0][0])return 'já'; return '';
    case 'plantar': if(wat)return 'Não dá na água'; if(busy||rd||G.rl[i]||G.ob[i]||qHas(x,y))return 'Ocupado'; return '';}
  return 'já';}
function applyTool(tool,x,y,opt){const why=toolCheck(tool,x,y,opt); if(why)return why; undoTouch(x,y,!!TOOLS[tool].q); const tl=TOOLS[tool], cc=toolCost(tool,opt);
  if(tool==='remover'){const i=y*N+x; if(G.ob[i])return clearOb(x,y)?'':'sem'; if(G.rl[i])G.rl[i]=0; else G.rd[i]=0; puff(x+.5,y+.5); mapVer++; after(); return '';}
  if(tool==='apagar'){const qi=y*Q2+x; G.pv[qi]=0; G.fc[qi]=0; mapVer++; markDirty(); return '';}
  if(lacksMat(cc.mat,cc.c).length)return 'sem';
  S.coins-=cc.c; payMat(cc.mat);
  if(tl.q){const qi=y*Q2+x; if(tool==='piso')G.pv[qi]=(opt||0)+1; else G.fc[qi]=(opt||0)+1; mapVer++; markDirty(); return '';}
  const i=y*N+x;
  switch(tool){
    case 'rua':G.rd[i]=1;S.st.road++; clearQ(x,y); break;
    case 'ponte':G.rd[i]=2;G.bm[i]=opt||0;S.st.bridge++; break;
    case 'trilho':G.rl[i]=1; clearQ(x,y); break;
    case 'elevar':G.ht[i]=Math.min(4,G.ht[i]+(G.rp[i]?1:1)); G.rp[i]=0; S.st.terra++; snowFix(i); break;
    case 'rebaixar':if(G.rp[i])G.rp[i]=0; else G.ht[i]--; S.st.terra++; snowFix(i); break;
    case 'nivelar':G.ht[i]=opt||0; G.rp[i]=0; S.st.terra++; snowFix(i); break;
    case 'rampa':{const L=G.ht[i]; for(let d=0;d<4;d++){const X=x+DIRS4[d][0],Y=y+DIRS4[d][1]; if(inMap(X,Y)&&edgeZ(X,Y,(d+2)%4)===L+1){G.rp[i]=d+1;break;}} S.st.terra++; break;}
    case 'cavar':G.tr[i]=1;S.st.dig++; clearQ(x,y); break;
    case 'aterrar':G.tr[i]=0; break;
    case 'pintar':G.tr[i]=SOILS[opt||0][0]; break;
    case 'plantar':G.ob[i]=G.ht[i]>0||Math.random()<.4?2:1; break;}
  if(cc.c)gainXp(Math.max(1,Math.round(cc.c/30)));
  puff(x+.5,y+.5); mapVer++; after(); return '';}
function snowFix(i){if(G.ht[i]<4&&G.tr[i]===6)G.tr[i]=0;} // a neve do alto vem em degradê no sombreado
function clearQ(x,y){for(const [a,b] of [[0,0],[1,0],[0,1],[1,1]]){const qi=(y*2+b)*Q2+x*2+a; G.pv[qi]=0; G.fc[qi]=0;}}
// troca o modelo de uma ponte inteira (todos os trechos ligados)
function bridgeSpan(x,y){const out=[],seen=new Set([y*N+x]),q=[[x,y]]; while(q.length){const [a,b]=q.pop(); out.push([a,b]); for(const [dx,dy] of DIRS4){const X=a+dx,Y=b+dy,i=Y*N+X; if(inMap(X,Y)&&!seen.has(i)&&G.rd[i]===2){seen.add(i);q.push([X,Y]);}}} return out;}
function rebuildBridge(x,y,m){const span=bridgeSpan(x,y).filter(([a,b])=>G.bm[b*N+a]!==m); if(!span.length)return; const M=BRIDGES[m]; const tot={}; for(const k in M.mat)tot[k]=M.mat[k]*span.length;
  const l=lacksMat(tot,M.c*span.length); if(l.length){toast('Faltam '+l.join(', '));return;} S.coins-=M.c*span.length; payMat(tot); for(const [a,b] of span){G.bm[b*N+a]=m; puff(a+.5,b+.5);} mapVer++; after(); toast('Ponte trocada para '+M.name);}

/* ---- Expansão ---- */
function chunkBuyable(cx,cy){if(cx<0||cy<0||cx>=NC||cy>=NC||S.ul[cy*NC+cx])return false;
  return DIRS4.some(([a,b])=>{const X=cx+a,Y=cy+b;return X>=0&&Y>=0&&X<NC&&Y<NC&&S.ul[Y*NC+X];});}
function chunkWater(cx,cy){let w=0; for(let y=0;y<CH;y++)for(let x=0;x<CH;x++)if(G.tr[(cy*CH+y)*N+cx*CH+x]===2)w++; return w/(CH*CH);}
function chunkCost(cx,cy){const c=expCost(S.st.expand); return chunkWater(cx,cy)>.5?Math.round(c/2/50)*50:c;}
function buyChunk(cx,cy){const cost=chunkCost(cx,cy), pop=expPop(S.st.expand);
  if(D.pop<pop){toast('Precisa de '+fmtN(pop)+' moradores para expandir');return;}
  if(S.coins<cost){toast('Faltam '+fmtN(cost-S.coins)+' moedas');return;}
  S.coins-=cost; S.ul[cy*NC+cx]=1; S.st.expand++; mapVer++; gainXp(Math.round(cost/30)); after(); toast('Nova área liberada! Limpe os obstáculos para construir.');
  if(!S.ul.some((v,i)=>!v&&chunkBuyable(i%NC,Math.floor(i/NC))))setMode({t:'idle'}); else updatePlaceBar();}

/* ================= Coleções ================= */
function drop(id,chance,b){if(Math.random()>chance)return; const c=COLS[id]; const arr=S.col[id]||(S.col[id]=c.items.map(()=>0)); const k=(Math.random()*c.items.length)|0; arr[k]++;
  toast('Item de coleção: '+c.items[k]+' ('+c.name+')'); if(b)floatAt(b,'★ '+c.items[k],'#ffe066'); markDirty();}
function colDone(id){const a=S.col[id]; return a&&a.every(v=>v>0);}
function tradeCol(id){if(!colDone(id))return; const c=COLS[id]; S.col[id]=S.col[id].map(v=>v-1); S.coins+=c.coins; gainXp(c.xp); toast('Coleção trocada: +'+fmtN(c.coins)+' moedas e '+c.xp+' XP'); after();}

/* ================= Encomendas ================= */
function availItems(){const a=['goods','wood','stone']; if(S.lv>=8)a.push('steel','tools'); if(S.lv>=10)a.push('rubber'); if(S.lv>=11)a.push('tires'); if(S.lv>=14)a.push('cars'); return a;}
function genOrder(){const av=availItems(), n=Math.random()<.4&&av.length>2?2:1, items={}; const pool=av.slice();
  for(let k=0;k<n;k++){const it=pool.splice((Math.random()*pool.length)|0,1)[0]; const base=it==='goods'?30+S.lv*6:it==='cars'?1:Math.max(2,Math.round((3+S.lv/2)*(it==='tools'||it==='tires'?.5:1))); items[it]=base;}
  let v=0; for(const k in items)v+=ITEMS[k].val*items[k]; return {items,coins:Math.round(v*1.8/10)*10+50,xp:Math.max(5,Math.round(v/25))};}
function refreshOrders(){const now=Date.now(); for(let i=0;i<3;i++){if(!S.ord[i]&&now>=(S.ordT[i]||0)){S.ord[i]=genOrder(); markDirty();}}}
function deliverOrder(i){const o=S.ord[i]; if(!o)return; const l=lacksMat(o.items); if(l.length){toast('Faltam '+l.join(', '));return;}
  payMat(o.items); S.coins+=o.coins; gainXp(o.xp); S.st.order++; S.ord[i]=null; S.ordT[i]=Date.now()+60000; toast('Encomenda entregue: +'+fmtN(o.coins)+' moedas'); drop('brinq',.12); after();}
function skipOrder(i){S.ord[i]=null; S.ordT[i]=Date.now()+5*60000; markDirty();}

/* ================= Desafios diários e semanais ================= */
const CH_T=[['rent','Colete aluguel',l=>8+l],['harvest','Colha plantações',l=>4+Math.floor(l/2)],['supply','Abasteça comércios',l=>4+Math.floor(l/3)],
  ['clear','Limpe obstáculos',l=>5],['build','Construa algo novo',l=>3],['road','Construa trechos de rua',l=>8],['biz','Colete comércios',l=>5+Math.floor(l/3)],
  ['prod','Colete produções da indústria',l=>3+Math.floor(l/4),4],['order','Entregue encomendas',l=>2],['export','Exporte cargas',l=>1,5],['terra','Modele o terreno',l=>6,3]];
function dayIdx(now){const d=new Date(now); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5);}
function pickCh(seed,n,lv){const ok=CH_T.filter(c=>!c[3]||lv>=c[3]); const out=[]; let k=0; while(out.length<n&&k<50){const c=ok[hsh(seed,k++,11)%ok.length]; if(!out.includes(c[0]))out.push(c[0]);} return out;}
function refreshCh(){const now=Date.now(), di=dayIdx(now), wi=Math.floor((di+3)/7); let ch=S.ch;

const titleQueue=[];

function checkTitle(){const k=titleIdx(D.pop); if(k>S.title){for(let i=S.title+1;i<=k;i++){S.coins+=TITLES[i][2]; titleQueue.push(i);} S.title=k; if($('#modal').hidden)showTitle();}}

function activeQuests(){const out=[]; for(const q of Q){if(S.q.done.includes(q.id))continue; out.push(q); if(out.length>=3)break;} return out;}
function qProg(q){const o=q.o;
  switch(o.t){case 'own':return countDone(o.k); case 'stat':return S.st[o.s]-(S.q.base[q.id]??S.st[o.s]);
    case 'lv':return S.lv; case 'pop':return D.pop; case 'exp':return S.st.expand;
    case 'happy':{let n=0; for(const b of S.b){if(T[b.k].cat==='res'&&cov(b).mask===31)n++;} return n;}
    case 'rail':return D.linked.size;}
  return 0;}
function refreshQuests(){for(const q of activeQuests()){if(q.o.t==='stat'&&S.q.base[q.id]==null){S.q.base[q.id]=S.st[q.o.s];markDirty();}}}
function claimQuest(id){const q=Q.find(x=>x.id===id); if(!q||S.q.done.includes(id)||qProg(q)<q.o.n)return;
  S.q.done.push(id); delete S.q.base[id]; S.coins+=q.coins; toast('Missão concluída: +'+fmtN(q.coins)+' moedas'+(q.xp?' · +'+q.xp+' XP':''));

const isLit=(id,k)=>hsh(id,k,5)%10<6;

function winGrid(c,x0,y0,x1,y1,z0,z1,rows,nl,nr,glass,skipDoor){const st=(z1-z0)/rows;

function hip(c,x0,y0,x1,y1,z,hh,col){const w=x1-x0,h=y1-y0;

let SID=7;
const ART={};

    for(let k=0;k<nr;k++)wR(c,x1,y0,y1,(k+.25)/nr,(k+.75)/nr,za,zb,f*10+k+5);}
  const du=(door+.5)/nl, dx=x0+(x1-x0)*du; qL(c,x0,x1,y1,du-.32/nl,du+.32/nl,Z,Z+Math.min(fh*.72,13),DOOR);

function cropCanvas(cv){const c=cv.getContext('2d'); const W=cv.width,H=cv.height; const d=c.getImageData(0,0,W,H).data;

/* ================= Lista de desenho e backends (Canvas 2D / WebGL com PixiJS) =================
 Cada quadro vira uma lista de "prims" em coordenadas do mundo. O backend Canvas desenha com drawImage;
 o backend PixiJS reaproveita um conjunto de Sprites. Marcas, bolhas e textos vão num canvas 2D por cima. */
const DL={n:0,a:[]};
function dlReset(){DL.n=0;}
function dlNext(){let p=DL.a[DL.n]; if(!p)p=DL.a[DL.n]={k:0,img:null,x:0,y:0,w:0,h:0,al:1,fl:false,add:false,src:null,m:null,col:0}; DL.n++; return p;}
// imagem num retângulo do mundo
function pImg(img,x,y,w,h,al,fl,add,src){const p=dlNext(); p.k=0; p.img=img; p.x=x; p.y=y; p.w=w; p.h=h; p.al=al==null?1:al; p.fl=!!fl; p.add=!!add; p.src=src||null; return p;}
// imagem com matriz afim: mundo = m · pixel da imagem
function pMat(img,m,al,add){const p=dlNext(); p.k=1; p.img=img; p.m=m; p.al=al==null?1:al; p.add=!!add; p.fl=false; p.src=null; return p;}
// retângulo de cor sólida (col = 0xRRGGBB)
function pRect(x,y,w,h,col,al,add){const p=dlNext(); p.k=2; p.x=x; p.y=y; p.w=w; p.h=h; p.col=col; p.al=al==null?1:al; p.add=!!add; return p;}
// camada já pronta {cv,x,y,w,h}
function pLayer(L,al,add){if(L)pImg(L.cv,L.x,L.y,L.w,L.h,al,false,add);}
// sprite {cv,ox,oy,sx,sy} ancorado em X,Y (mesmo cálculo do drawSprite)
function pSprite(s,X,Y,flip,al,sq,add){if(!s||!s.cv)return; const w=s.cv.width/s.sx,h=s.cv.height/s.sy, u0=-s.ox/s.sx, v0=-s.oy/s.sy;
  let a=1,d=1,e=0,f=0; if(sq){a=sq[0];d=sq[1];e=sq[2];f=sq[3];}
  const x=flip?X-(a*(u0+w)+e):X+a*u0+e; pImg(s.cv,x,Y+d*v0+f,a*w,d*h,al,flip,add);}

function rainTex(){if(RAINCV)return RAINCV; const s=128, c2=document.createElement('canvas'); c2.width=c2.height=s; const c=c2.getContext('2d'); const r=rng(31);
  c.strokeStyle='rgba(210,225,245,.55)'; c.lineCap='round';
  for(let k=0;k<26;k++){const x=r()*s,y=r()*s,l=7+r()*9; c.lineWidth=.8+r()*.7; c.beginPath(); c.moveTo(x,y); c.lineTo(x-l*.28,y+l); c.stroke();

/* ---- backend Canvas 2D ---- */
const BK2D={name:'Canvas',
  draw(){const c=g; c.setTransform(1,0,0,1,0,0); c.globalAlpha=1; c.globalCompositeOperation='source-over';
    c.fillStyle='#3d6a34'; c.fillRect(0,0,cv.width,cv.height);
    setIso(c); patT(PAT.sea,seaK(),FR.seaX,FR.seaY); c.fillStyle=PAT.sea; c.beginPath(); for(const [x,y,w,h] of SEA_OUT)c.rect(x,y,w,h); for(const e of FR.seaCk)c.rect(e.cx*CH,e.cy*CH,CH,CH); c.fill();
    const K=TGT.k,TX=TGT.tx,TY=TGT.ty; let add=false, al=1, id=false; c.setTransform(1,0,0,1,0,0); id=true;
    for(let i=0;i<DL.n;i++){const p=DL.a[i];
      if(p.add!==add){c.globalCompositeOperation=p.add?'lighter':'source-over'; add=p.add;}
      if(p.al!==al){c.globalAlpha=p.al; al=p.al;}

const isWater=i=>G.tr[i]===1||G.tr[i]===2;

/* ---- camadas planas ---- */
// cantos arredondados entre água/terra e entre tipos de chão (o rio, o lago, a praia e o deserto não ficam em escadinha)

// forma da água do quadrado: cantos arredondados onde há terra nos dois lados do canto
function waterRound(x,y){return [0,1,2,3].map(k=>{const [sx,sy]=CORN[k]; return !isW2(x+sx,y)&&!isW2(x,y+sy)&&inMap(x+sx,y)&&inMap(x,y+sy);});}

// contorno da água do pedaço (quadrados com cantos redondos + pontas de terra cortadas), um quadrado além da borda
function waterPath(x0,y0){const wp=new Path2D(), lake=new Path2D(); let wat=false, lk=false;

    else{const cut=landCut(x,y); for(let k=0;k<4;k++)if(cut[k]){cornerPiece(wp,x,y,k); wat=true; const [sx,sy]=CORN[k]; if(soilAt(x+sx,y)===1&&inside){cornerPiece(lake,x,y,k); lk=true;}}}}

function drawBase(c,cx,cy){const x0=cx*CH,y0=cy*CH; setIso(c); const e=.03;
    const under=(x,y)=>{for(const [a,b] of DIRS4){const t=soilAt(x+a,y+b); if(t>=0&&t!==1&&t!==2)return t;} return 0;};   // chão debaixo da água (aparece nos cantos)
    for(const code of [0,3,4,5,6,7]){c.beginPath(); let any=false;
      for(let y=y0;y<y0+CH;y++)for(let x=x0;x<x0+CH;x++){const i=y*N+x; const t=isWater(i)?under(x,y):G.tr[i]; if(t===code){c.rect(x-e,y-e,1+2*e,1+2*e); any=true;}}
      if(any){const p=SOIL_PAT(code); patT(p,32); c.fillStyle=p; c.fill();}}
    // cantos entre tipos de chão: o canto vira o chão dos dois vizinhos quando eles são iguais
    const cp=new Map();
    for(let y=y0;y<y0+CH;y++)for(let x=x0;x<x0+CH;x++){const i=y*N+x; if(isWater(i))continue; const A=G.tr[i];
      for(let k=0;k<4;k++){const [sx,sy]=CORN[k], B=soilAt(x+sx,y), C=soilAt(x,y+sy); if(B<0||B!==C||B===A||B===1||B===2)continue;
        let p=cp.get(B); if(!p)cp.set(B,p=new Path2D()); cornerPiece(p,x,y,k);}}
    for(const [B,p] of cp){const pt=SOIL_PAT(B); patT(pt,32); c.fillStyle=pt; c.fill(p);}

// terreno de fora do mapa (continuação à esquerda e na frente): só paisagem, a câmera não passa muito dele

function bakeGround(cx,cy,rs){const bb=chunkBox(cx,cy);

function drawDetail(c,cx,cy){const x0=cx*CH,y0=cy*CH, owned=!!S.ul[cy*NC+cx]; setIso(c);

    const br=[]; for(let y=y0;y<y0+CH;y++)for(let x=x0;x<x0+CH;x++)if(G.rd[y*N+x]===2)br.push([x,y]); br.sort((a,b)=>a[0]+a[1]-b[0]-b[1]);

function qHasPv(x,y){const a=(y*2)*Q2+x*2,b=a+Q2; return G.pv[a]||G.pv[a+1]||G.pv[b]||G.pv[b+1];}
// espuma: anel fino em volta da água, seguindo o contorno redondo
function bakeFoam(cx,cy,rs){const x0=cx*CH,y0=cy*CH, bb=chunkBox(cx,cy); let any=false;

  });}
function bakePuddles(cx,cy,rs){const x0=cx*CH,y0=cy*CH, bb=chunkBox(cx,cy); const spots=[];
  for(let y=y0;y<y0+CH;y++)for(let x=x0;x<x0+CH;x++){const i=y*N+x; if(elev(i))continue; const h=hsh(x,y,77);

// luzes da noite (ficam prontas e entram com mistura aditiva): 0 = brilho no chão, 1 = lâmpadas e letreiros

/* ---- fatias de profundidade ---- */
const UNDER_D=(cx,cy)=>-1e6+(cx+cy)*CH;

    if(el)out.push({d:D.under[i]?UNDER_D(cx,cy)+x+y:x+y+.99,t:0,x,y});

  for(const o of cars){if(!isCarRd(o.x,o.y)){o.dead=1;continue;}

/* ---- Sobreposições de tela ---- */
function bubbleFor(b,now){const t=T[b.k]; if(now<b.d)return null;
  if(b.fire)return ['fire'];
  if(S.req&&S.req.some(r=>r.b===b.i))return ['talk'];
  if(t.cat==='res'&&now>=b.a)return ['coin'];
  if(t.cat==='biz'){if(b.s===0)return [t.item?'item:'+t.item:'crate',supHave(t)<t.sup]; if(now>=b.a)return ['coin'];}
  if(isGen(t)&&now>=b.a)return ['coin'];
  if(t.rec){if(b.s==='run'&&now>=b.a)return ['item:'+Object.keys(t.rec.out)[0]]; if(!b.s)return ['gear',!canStart(b)];}
  if(b.k==='plot'&&b.s&&now>=b.a)return ['leaf'];
  if(b.k==='estacao'){if(!b.s)return D.linked.has(b.i)?['train']:['rail',true]; if(now>=b.a)return [b.s==='exp'?'coin':'crate'];}
  if(b.k==='porto'||b.k==='aeroporto'){if(!b.s)return [b.k==='porto'?'ship':'plane']; if(now>=b.a)return ['coin'];}

/* ================= Pedestres =================

    if(isCarRd(x,y+1)&&linked(x,y,1)){const b2=(t+N)*4; add(base+3,b2+0,null); add(base+2,b2+1,null);}}

  const PB=4*N*N;
  for(let qy=0;qy<Q2;qy++)for(let qx=0;qx<Q2;qx++){const qi=qy*Q2+qx; if(!G.pv[qi])continue;

/* ================= Sistemas: poluição, leis, pesquisa, pedidos, cadeias, incêndios, histórico ================= */

/* ---- Poluição: indústria, trânsito e porto poluem; parques, árvores, leis e educação reduzem ---- */
function polSource(b){const t=T[b.k]; if(Date.now()<b.d)return 0; return t.poll||POLL[b.k]||0;}
function computePollution(d,now){const F=d.poll; F.fill(0); const prevEdu=D&&D.edu||0;
  const eduF=Math.min(1,prevEdu*(law('integral')?2:1)); let ind=0,traf=0,port=0,sink=0;
  const mInd=(law('filtros')?.6:1)*(law('coleta')?.8:1)*(hasTech('reciclagem')?.9:1)*(1-.3*eduF);
  const mTraf=(law('onibus')?.7:1)*(hasTech('smart')?.85:1)*(law('coleta')?.8:1)*(hasTech('reciclagem')?.9:1)*(1-.3*eduF);
  const splat=(cx,cy,r,v)=>{const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(N-1,Math.ceil(cx+r)),y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(N-1,Math.ceil(cy+r));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dd=Math.hypot(x+.5-cx,y+.5-cy); if(dd<=r)F[y*N+x]+=v*(1-dd/(r+1));}};
  for(const b of S.b){const v=polSource(b); if(!v)continue; const w=fw(b),h=fh(b); const isPort=b.k==='porto'||b.k==='aeroporto'||b.k==='marina'; const val=v*mInd;
    if(isPort)port+=val; else ind+=val; splat(b.x+w/2,b.y+h/2,7,val*1.2);}
  // trânsito: proporcional aos carros, espalhado pelas ruas
  if(d.roadN){const cars=clamp(Math.floor((d.pop-80)/70)+Math.floor(Math.max(0,d.roadN-30)/14),0,60); const per=cars*mTraf*.08; traf=Math.round(cars*mTraf*.5);
    if(per>0.01)for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!isCarRd(x,y))continue; splat(x+.5,y+.5,2.5,per);}}
  // o que limpa
  const mS=(law('verde')?1.5:1)*(1+.3*eduF);
  for(const b of S.b){const v=SINK[b.k]||T[b.k].sink||0; if(!v||now<b.d)continue; const w=fw(b),h=fh(b); sink+=v*mS; splat(b.x+w/2,b.y+h/2,4+Math.min(4,v/4),-v*mS*1.4);}
  let trees=0; for(let y=0;y<N;y++)for(let x=0;x<N;x++){const o=G.ob[y*N+x]; if((o===1||o===2)&&isUl(x,y)){trees++; F[y*N+x]-=.6*mS;}}
  const clean=d.clean||0; const glob=(law('coleta')?.8:1);
  for(let i=0;i<N*N;i++){F[i]=Math.max(0,F[i]*glob-clean*.4);}
  d.pollSrc={ind:Math.round(ind),traf:Math.round(traf),port:Math.round(port),sink:Math.round(sink+trees*.3),clean,edu:Math.round(eduF*100)};}
const pollAt=(b)=>{const w=fw(b),h=fh(b); let s=0,n=0; for(let y=b.y;y<b.y+h;y++)for(let x=b.x;x<b.x+w;x++){if(inMap(x,y)){s+=D.poll[y*N+x];n++;}} return n?s/n:0;};
const pollPenalty=p=>clamp((p-25)/75,0,1)*.2;

/* ---- extras no cálculo da cidade (chamado no fim do derive) ---- */
function deriveExtra(d,now){
  // bombeiros cobrem um raio; fora disso pode haver incêndios leves
  for(const b of S.b){const t=T[b.k]; if(!t.fireR||now<b.d)continue; const r=t.fireR, w=fw(b),h=fh(b);
    for(let y=Math.max(0,b.y-r);y<Math.min(N,b.y+h+r);y++)for(let x=Math.max(0,b.x-r);x<Math.min(N,b.x+w+r);x++)d.fireCov[y*N+x]=1;}
  let rate=0; for(const b of S.b){if(now<b.d)continue; const t=T[b.k]; if(t.research)rate+=t.research; else if(b.k==='universidade')rate+=6; else if(b.k==='biblioteca')rate+=1;} d.rpRate=rate;
  let pe=0,pp=0,ps=0,sh=0; for(const b of S.b){const t=T[b.k]; if(t.cat!=='res'||now<b.d)continue; const c=cov(b); pp+=t.pop; if((c.mask>>NEED_I.edu)&1)pe+=t.pop; ps+=(c.poll||0)*t.pop; sh+=(((c.mask>>NEED_I.sau)&1)?1:.55)*(1-Math.min(.5,(c.poll||0)/200))*t.pop;}
  d.edu=pp?pe/pp:0; d.pollAvg=pp?ps/pp:0; d.health=pp?sh/pp:1;}

/* ---- Pesquisa (pontos do Campus) ---- */
function researchTick(now){const dt=Math.min(12*3600,(now-S.rpT)/1000); if(dt<=0)return; S.rpT=now; if(!D.rpRate)return; S.rp+=D.rpRate*dt/3600;}
function doResearch(id){const t=TECH.find(x=>x.id===id); if(!t)return; const st=techState(t); if(st!=='pronta'){toast(st==='feita'?'Já pesquisada':st==='bloqueada'?'Pesquise antes: '+t.req.map(r=>TECH.find(x=>x.id===r).name).join(', '):'Faltam '+Math.ceil(t.rp-S.rp)+' pontos de pesquisa');return;}
  S.rp-=t.rp; S.tech.push(id); S.st.research++; gainXp(20+t.rp/2); toast('Tecnologia pronta: '+t.name); after();}

/* ---- Leis: custo cobrado por minuto ---- */
function toggleLaw(id){const L=LAWS.find(l=>l.id===id); if(!L)return; const why=lawOpen(L); if(why&&!S.laws[id]){toast(why);return;}
  if(S.laws[id])delete S.laws[id]; else{S.laws[id]=1; S.st.law++;} toast((S.laws[id]?'Lei ligada: ':'Lei desligada: ')+L.name); after();}
function lawTick(now){const min=(now-S.lawT)/60000; if(min<1)return; const m=Math.min(min,6*60); S.lawT=now; let cost=0;
  for(const id in S.laws){const c=lawCost(id); if(c)cost+=c*m/60; if(id==='feira'){const g=15*m/60; if(S.goods>=g)S.goods-=g; else{delete S.laws.feira; toast('Feira livre suspensa: faltaram mercadorias');}}}
  cost=Math.round(cost); if(cost>0){if(S.coins>=cost)S.coins-=cost; else{const ids=Object.keys(S.laws).filter(i=>lawCost(i)); if(ids.length){delete S.laws[ids[ids.length-1]]; toast('Sem moedas para as leis: uma lei foi desligada');}}} markDirty();}

/* ---- Pedidos dos moradores ---- */
function reqCheck(r){const b=byId(r.b); if(!b)return 'some'; const now=Date.now();
  switch(r.type){
    case 'parque':return S.b.some(o=>PARKS.includes(o.k)&&now>=o.d&&dist(b,o)<=r.r);
    case 'arvores':return countNear(b,['arvore','ipe'],r.r)>=r.n;
    case 'calcada':return pvNear(b,r.r)>=r.n;
    case 'comercio':return S.b.some(o=>T[o.k].cat==='biz'&&now>=o.d&&dist(b,o)<=r.r);
    case 'colher':return S.st.harvest-r.base>=r.n;
    case 'saude':return ((cov(b).mask>>NEED_I.sau)&1)===1;
    case 'entrega':return (r.item==='goods'?S.goods:S.inv[r.item])>=r.q;}
  return false;}
function reqText(r){const T2=REQ_TYPES.find(t=>t.id===r.type); let s=T2?T2.txt:'';
  if(r.type==='entrega')s+=' ('+r.q+' '+ITEMS[r.item].ico+' '+ITEMS[r.item].name.toLowerCase()+')';
  if(r.type==='arvores')s+=' (árvores a até 3 quadrados: '+(byId(r.b)?countNear(byId(r.b),['arvore','ipe'],3):0)+' de '+r.n+')';
  if(r.type==='calcada')s+=' (pedaços de calçada por perto: '+(byId(r.b)?pvNear(byId(r.b),2):0)+' de '+r.n+')';
  if(r.type==='colher')s+=' ('+Math.max(0,S.st.harvest-r.base)+' de '+r.n+' colheitas)';
  return s;}
function newRequest(now){const homes=S.b.filter(b=>T[b.k].cat==='res'&&now>=b.d&&!S.req.some(r=>r.b===b.i)); if(!homes.length)return;
  const b=homes[(Math.random()*homes.length)|0]; const tot=REQ_TYPES.reduce((s,t)=>s+t.w,0); let u=Math.random()*tot, ty=REQ_TYPES[0]; for(const t of REQ_TYPES){u-=t.w; if(u<=0){ty=t;break;}}
  const r=Object.assign({b:b.i,type:ty.id,t:now},ty.make(b)); if(reqCheck(r)===true&&r.type!=='entrega')return;

/* ---- Cadeias de missões ---- */
function chainStep(ch){return S.chain[ch.id]||0;}
function chainProg(ch){const k=chainStep(ch); const st=ch.steps[k]; if(!st)return null; const o=st.o; const now=Date.now();
  switch(o.t){case 'own':return [countDone(o.k),o.n];
    case 'ownAny':return [S.b.filter(b=>o.ks.includes(b.k)&&now>=b.d).length,o.n];
    case 'ownAll':return [o.ks.filter(k=>countDone(k)>0).length,o.ks.length];
    case 'stat':{const key=ch.id+':'+k; if(S.chainBase[key]==null){S.chainBase[key]=S.st[o.s]||0; markDirty();} return [(S.st[o.s]||0)-S.chainBase[key],o.n];}
    case 'law':return [law(o.id)?1:0,1];
    case 'pollBelow':return [D.pop>=300&&D.pollAvg<o.n?1:0,1];
    case 'tech':return [S.tech.length,o.n];
    case 'pop':return [D.pop,o.n];
    case 'tourists':return [D.tourists,o.n];}
  return [0,1];}
function chainAdvance(id){const ch=CHAINS.find(c=>c.id===id); if(!ch||S.lv<ch.lv)return; const p=chainProg(ch); if(!p||p[0]<p[1])return;
  S.chain[id]=chainStep(ch)+1; S.st.chainStep++; S.coins+=500+S.lv*80; gainXp(40+S.lv*4);
  if(S.chain[id]>=ch.steps.length){S.unl[ch.reward]=1; showUnlock(T[ch.reward].name,'Você completou a cadeia "'+ch.name+'". Esse prédio só sai por ela.');}
  else toast('Etapa concluída: '+ch.name); after();}
function chainsReady(){let n=0; for(const ch of CHAINS){if(S.lv<ch.lv)continue; const p=chainProg(ch); if(p&&p[0]>=p[1])n++;} return n;}

function placeRule(t,x,y,w,h){if(!t.place)return ''; let ok=0,tot=0;
  for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){const X=x+dx,Y=y+dy; if(!inMap(X,Y))continue; const i=Y*N+X; tot++;
    if(t.place==='morro'&&G.ht[i]>=2)ok++; if(t.place==='deserto'&&G.tr[i]===4)ok++; if(t.place==='praia'&&(G.tr[i]===3||nearSea(X,Y)))ok++;}
  if(t.place==='morro'&&ok<tot)return 'Vai no alto dos morros (nível 2 ou mais)';
  if(t.place==='deserto'&&ok<tot)return 'Vai no deserto, ao sul';
  if(t.place==='praia'&&!ok)return 'Vai na praia, perto do mar';
  return '';}
function nearSea(x,y){for(const [a,b] of DIRS4){const X=x+a,Y=y+b; if(inMap(X,Y)&&G.tr[Y*N+X]===2)return true;} return false;}

const UNDO=[]; let undoRec=null;
function undoBegin(){undoRec={cells:new Map(),coins:S.coins,inv:Object.assign({},S.inv),goods:S.goods};}
function undoTouch(x,y,q){if(!undoRec)return; const snap=(g,i)=>{const key=g+':'+i; if(!undoRec.cells.has(key))undoRec.cells.set(key,G[g][i]);};
  if(q){const qi=y*Q2+x; snap('pv',qi); snap('fc',qi); return;} if(!inMap(x,y))return; const i=y*N+x; for(const g of ['tr','ht','rp','rd','bm','rl','ob'])snap(g,i);
  for(const [a,b] of [[0,0],[1,0],[0,1],[1,1]]){const qi=(y*2+b)*Q2+x*2+a; snap('pv',qi); snap('fc',qi);}}
function undoEnd(){if(!undoRec)return; let ch=false; for(const [k,v] of undoRec.cells){const [g,i]=k.split(':'); if(G[g][+i]!==v){ch=true;break;}}
  if(ch){undoRec.coins1=S.coins; undoRec.inv1=Object.assign({},S.inv); UNDO.push(undoRec); if(UNDO.length>20)UNDO.shift();} undoRec=null; updateToolbar();}
function undoLast(){const r=UNDO.pop(); if(!r){toast('Nada para desfazer');return;}
  for(const [k,v] of r.cells){const [g,i]=k.split(':'); G[g][+i]=v;}
  S.coins=Math.max(0,S.coins+(r.coins-r.coins1)); for(const k in r.inv)S.inv[k]=Math.max(0,S.inv[k]+(r.inv[k]-(r.inv1[k]||0)));
  mapVer++; after(); toast('Desfeito'); updateToolbar();}
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')&&mode.t==='paint'){e.preventDefault(); undoLast();}});

/* ---- Construir em linha ---- */
function lineCells(k,ax,ay,bx,by,f){const t=T[k],w=f?t.h:t.w,h=f?t.w:t.h; const out=[];
  if(Math.abs(bx-ax)>=Math.abs(by-ay)){const s=Math.sign(bx-ax)||1; for(let x=ax;s>0?x<=bx:x>=bx;x+=s*w){out.push([x,ay]); if(out.length>40)break;}}
  else{const s=Math.sign(by-ay)||1; for(let y=ay;s>0?y<=by:y>=by;y+=s*h){out.push([ax,y]); if(out.length>40)break;}}
  return out;}
function placeLine(){const k=mode.k; let n=0,spent=0; for(const [x,y] of mode.line){if(!canBuy(k,true))break; if(!canPlace(k,x,y,mode.f,-2))continue; const c0=S.coins; if(placeNew(k,x,y,mode.f)){n++; spent+=c0-S.coins;}}
  toast(n?n+' construído(s) em linha (−'+fmtN(spent)+')':'Nada coube nessa linha'); mode.line=null; mode.anchor=null; if(!canBuy(k,true))setMode({t:'idle'}); else updatePlaceBar();}

/* ---- Backup do save em arquivo ---- */
async function backupSave(){saveNow(); const json=serialize(); const name='cidade-viva-'+(S.name||'cidade').replace(/[^\w\-]+/g,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10)+'.json';
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:json}); toast('Backup salvo'); return;}}
  catch(e){if(e&&e.code==='declined'){toast('Backup cancelado');return;} if(e&&e.code==='rate_limited'){toast('Espere um pouco e tente de novo');return;}}
  try{const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); toast('Backup baixado');}
  catch(e){toast('Não consegui baixar o arquivo aqui');}}
function restoreFile(file){const rd=new FileReader(); rd.onload=()=>{try{const s=JSON.parse(rd.result); if(!s||!Array.isArray(s.b))throw 0;
    confirmBox('Restaurar este backup?','A cidade atual será trocada pela do arquivo ('+(s.name||'sem nome')+', nível '+(s.lv||1)+').','Restaurar',()=>{if(hydrate(s)){cars=[]; peds=[]; ckFreeAll(); afterLoad(); saveNow(); toast('Backup restaurado');} else toast('Arquivo inválido');});}
  catch(e){toast('Esse arquivo não é um backup da Cidade Viva');}}; rd.readAsText(file);}

/* ---- HUD: clima e nome da cidade ---- */
function updateWx(){const el=$('#wx'); if(!el||!S)return; const w=weatherNow(Date.now()); el.textContent=w.ico+' '+w.name; el.title=S.name+' · '+w.name+(w.k===2?': plantações crescem 50% mais rápido':'');
  document.title=S.name&&S.name!=='Cidade Viva'?S.name+' · Cidade Viva':'Cidade Viva';}

$('#wx').onclick=()=>{if(sheetKind==='city'&&cityTab==='resumo')closeSheet(); else openCity('resumo');};
$('#restoreIn').onchange=e=>{const f=e.target.files[0]; if(f)restoreFile(f); e.target.value='';};

// renomear a cidade (sem prompt(): o visualizador não mostra diálogos do navegador)
function renameBox(){const m=$('#mcard'); m.innerHTML='<h3>Nome da cidade</h3><p><input id="cityName" maxlength="32" style="font:inherit;font-size:17px;width:100%;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--ink)"></p><div class="acts"><button class="pill" id="mNo">Cancelar</button><button class="pill go" id="mOk">Salvar</button></div>';
  $('#modal').hidden=false; const inp=$('#cityName'); inp.value=S.name||''; inp.focus(); inp.select();
  const ok=()=>{const nm=inp.value.trim(); if(nm){S.name=nm.slice(0,32); markDirty(); updateWx(); toast('A cidade agora se chama '+S.name);} closeModal(); if(sheetKind==='menu')openMenu();};
  $('#mOk').onclick=ok; $('#mNo').onclick=closeModal; inp.onkeydown=e=>{if(e.key==='Enter')ok(); e.stopPropagation();};}

// aviso do mapa novo (o save do mapa antigo fica guardado no aparelho)
function showNewMap(){$('#mcard').innerHTML='<h3>Mapa novo!</h3><p style="text-align:left;font-size:14.5px;line-height:1.45">A cidade agora fica num mapa maior, com serra de montanhas, dois platôs com estrada, rio com cachoeira, lago, praia e deserto com um arco de pedra. As áreas para comprar ficaram maiores (12×12) e a área inicial também (24×24).<br><br>O mapa também ficou maior (96×96). Como ele mudou inteiro, a cidade começou de novo. A cidade antiga ficou guardada neste aparelho.</p><div class="acts"><button class="pill gold" id="nmOk">Vamos lá</button></div>';
  $('#modal').hidden=false; $('#nmOk').onclick=closeModal;}

/* ---- 99-boot.js ---- */
/* ================= Início do jogo (sempre por último) ================= */
applyQual(); initPats(); bootState(); resize(); if(wantGL())switchBackend('webgl',true); window.__backendName=()=>BK.name; derive(); refreshQuests(); centerStart(); updateHud(); requestAnimationFrame(loop);
loadArtLocal(); loadBuiltinImages(); loadAllArt();
if(migratedMsg!=null)setTimeout(showMigrated,300); else if(!loadLocal())setTimeout(()=>toast('Toque nas bolhas sobre os prédios para coletar'),600);
saveNow(); initCloud();
refreshOrders(); refreshCh(); updateHud(); updateWx();
if(oldMapSaved)setTimeout(showNewMap,400); else if(upgradedV2||upgradedV3)setTimeout(showUpgrade,400);
setInterval(()=>{if(!S)return; refreshOrders(); refreshCh(); if(sheetKind==='city')openCity(null,true); else if(sheetKind==='city')liveTimers();},2000);
